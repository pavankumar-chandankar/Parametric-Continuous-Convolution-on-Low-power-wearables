dataset:
  sens_folder: data/sbhar/raw/inertial_with_id_no_t
  input_dim: 9
  sampling_rate: 50.0
  num_classes: 18
  window_size: 128
  window_overlap: 50
  tiou_thresholds:
  - 0.3
  - 0.4
  - 0.5
  - 0.6
  - 0.7
  channels: 9
  classes: 6
model:
  conv_kernels: 64
  conv_kernel_size: 9
  lstm_units: 128
  lstm_layers: 1
  dropout: 0.5
  conv_type: continuous
  conv_rank: 8
  conv_mlp_hidden_dim: 32
train_cfg:
  lr: 0.0001
  lr_decay: 0.9
  lr_step: 10
  epochs: 30
  weight_decay: 1.0e-06
  weight_init: xavier_normal
  weighted_loss: false
loader:
  train_batch_size: 100
  test_batch_size: 1
net_cfg:
  window_size: 128
  channels: 9
  classes: 6
log_name: deepconvlstm_sbhar
